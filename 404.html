<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0D0C" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://ciera.co.za/">
<title>CIERA</title>
<script>
  // app.leke.co.za was CIERA's temporary address. The app lives at
  // https://ciera.co.za now. This page is CIERA's launch screen: the mark
  // shows while the browser carries you across, path, query (invite links)
  // and hash intact.
  (function () {
    var target = 'https://ciera.co.za' + location.pathname + location.search + location.hash;
    window.cieraTarget = target;
    location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://ciera.co.za/">
<style>
  /* The same boot mark the app itself launches with (web/index.html in
     ciera-solo). All motion happens INSIDE the wordmark: the mark sits dim
     and a charge of brand blue sweeps through the letterforms, a white
     gleam riding just ahead of it, while the mark breathes. The SVG is the
     mask for every layer. */
  :root{color-scheme:light dark;}
  html{background:#FAFAFC;}
  body{background:#FAFAFC;margin:0;min-height:100vh;min-height:100dvh;
    font-family:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    color:#1c1c1e;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  @media (prefers-color-scheme:dark){
    html{background:#0D0D0C;} body{background:#0D0D0C;color:#f2f2f7;}}

  .base{background:rgba(80,144,205,.46)}
  .charge,.gleam{overflow:hidden}
  .charge::before,.gleam::before{
    content:'';position:absolute;top:0;bottom:0;left:0;width:78%;
    animation:ciera-sweep 2.2s cubic-bezier(.45,.05,.4,.95) infinite alternate;}
  .charge::before{background:linear-gradient(90deg,
    rgba(80,144,205,0), #5090CD 32%, #5090CD 68%, rgba(80,144,205,0));}
  .gleam::before{width:30%;animation-delay:.08s;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.95) 50%, transparent);}
  @media (prefers-color-scheme:dark){
    .base{background:rgba(111,170,224,.42)}
    .charge::before{background:linear-gradient(90deg,
      rgba(111,170,224,0), #6FAAE0 32%, #6FAAE0 68%, rgba(111,170,224,0));}
    .gleam::before{background:linear-gradient(90deg,
      transparent, rgba(205,230,255,.95) 50%, transparent);}}
  @keyframes ciera-sweep{0%{transform:translateX(-72%)}100%{transform:translateX(112%)}}
  @keyframes ciera-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  @media (prefers-reduced-motion:reduce){
    .mark{animation:none}
    .charge::before,.gleam::before{animation:none}
    .charge{background:#5090CD}
    .charge::before,.gleam{display:none}}

  /* Only if the browser did not carry you across (a home-screen install
     made from the old address, a blocked redirect). Appears after a beat,
     never on the way through. */
  #stay{margin-top:40px;font-size:15px;line-height:1.45;opacity:0;
    transition:opacity .4s ease;max-width:22rem;}
  #stay.on{opacity:1}
  #stay a{color:#5090CD;text-decoration:none;font-weight:600;}
  @media (prefers-color-scheme:dark){#stay a{color:#6FAAE0}}
  #stay p{margin:0 0 10px}
  #stay .re{font-size:13px;opacity:.7}
</style>
</head>
<body>
  <div class="mark" aria-label="CIERA" role="img">
    <span class="base"></span><span class="charge"></span><span class="gleam"></span>
  </div>
  <div id="stay" aria-live="polite">
    <p><a id="open" href="https://ciera.co.za/">Open CIERA</a></p>
    <p class="re" id="re" hidden>CIERA now lives at ciera.co.za. Add it to your home screen again from there.</p>
  </div>
  <script>
    (function () {
      var open = document.getElementById('open');
      if (window.cieraTarget) open.href = window.cieraTarget;
      var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
        navigator.standalone === true;
      if (standalone) document.getElementById('re').hidden = false;
      setTimeout(function () { document.getElementById('stay').className = 'on'; }, 1800);
    })();
  </script>
</body>
</html>
